<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cars Table</title>
</head>
<body>
<div>
  <h1>Car table:</h1>
  <table border="1">
    <thead>
    <tr>
      <th>Model</th>
      <th>Series</th>
      <th>Year</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="car : ${cars}">
      <td th:text="${car.getModel()}"></td>
      <td th:text="${car.getSeries()}"></td>
      <td th:text="${car.getYear()}"></td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
